name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Prepare release metadata
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_name=Roadmap Studio $version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and create GitHub release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.meta.outputs.release_name }}
          releaseBody: Atualizacao do Roadmap Studio ${{ steps.meta.outputs.version }}.
          releaseDraft: false
          prerelease: false
          args: ''

      - name: Publish updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $bundle = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1

          if (-not $bundle) {
            $bundle = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi.zip" | Select-Object -First 1
          }

          if (-not $bundle) {
            throw "MSI updater bundle not found."
          }

          $signaturePath = "$($bundle.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            throw "Updater signature not found: $signaturePath"
          }

          $json = [ordered]@{
            version = $version
            notes = "Roadmap Studio $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                url = "https://github.com/${{ github.repository }}/releases/download/$tag/$([uri]::EscapeDataString($bundle.Name))"
                signature = (Get-Content $signaturePath -Raw).Trim()
              }
            }
          } | ConvertTo-Json -Depth 8

          Set-Content -Path latest.json -Value $json -Encoding utf8NoBOM
          gh release upload $tag latest.json --clobber
